<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Progression Dex | Red and Blue</title>
    <script src="../theme.js"></script>
    <script src="../config.js"></script>
    <script src="../auth.js"></script>
    <link href="css/base.css" rel="stylesheet" />
    <link href="css/redblue.css" rel="stylesheet" />
    <link href="../output.css" rel="stylesheet" />
    <link href="css/theme.css" rel="stylesheet" />
    <link href="../images/icons/favicontab.ico" rel="icon" type="image/x-icon" />
    <link href="../images/icons/favicontab.ico" rel="shortcut icon" type="image/x-icon" />
    <meta name="description" content="A tool for tracking your progression in Pokemon games. Easily choose between games and track your game progress." />
    <meta name="keywords" content="pokemon, checklist, pokedex, progress, completion, speedrun, checklist, check list, locations, characters, games, game" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js" defer></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4PDLXC895H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-4PDLXC895H");

  </head>
  <body>
    <div class="navbar bg-white rounded-3xl shadow-lg mt-2 fixed top-0 flex items-center justify-between" style="width: 95%; z-index: 1000; left: 50%; transform: translateX(-50%)">
      <div class="flex items-center gap-4">
        <a href="../index.html" class="btn btn-ghost text-2xl"><span class="title">Progression Dex |</span></a>
        <div class="flex items-center gap-2">
          <img alt="Logo of Pokemon Red" id="red-logo" src="../images/logos/red-logo.webp" class="w-20" data-theme-color="#C23A22" data-theme-pattern="pattern-red.png" />
          <img alt="Logo of Pokemon Blue" id="blue-logo" src="../images/logos/blue-logo.webp" class="w-20" data-theme-color="#84ADD7" data-theme-pattern="pattern-blue.png" />
        </div>
      </div>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="page-container" data-game="redblue">
      <div class="wide-panel pokedex">
        <label class="panel-label">Pokédex</label>
        <div class="completepokedex">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Complete the Kanto Pokédex</label></span>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-trade-exclusives" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Trade them from Red/Blue." for="redblue-checkbox-trade-exclusives">Trade all version exclusives</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-trade-evolutions" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Trade Kadabra, Machoke, Graveler and Haunter to a friend (or a second copy of the game) so they evolve into Alakazam, Machamp, Golem and Gengar." for="redblue-checkbox-trade-evolutions"
              >Evolve all trade evolutions</label
            >
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-get-diploma" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="After catching all Pokémon, go to the Game Freak Headquarters in Celadon Condominiums and speak with the lead developer." for="redblue-checkbox-get-diploma">Get Diploma</label>
          </div>
        </div>
        <div class="legendaries">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Catch all Legendaries</label></span>
          </div>
          <div class="legendaries-rowcontainer">
            <div class="legendaries-leftrow">
              <div class="checkbox-item">
                <input id="redblue-checkbox-zapdos" type="checkbox" />
                <img alt="Icon of Zapdos" class="pokeicon small" src="../images/icons/pokemon/gen1/redblue/zapdos-color.png" />
                <label class="text-sm lg:tooltip" data-tip="Zapdos appears at the end of the Power Plant in the room with the exit." for="redblue-checkbox-zapdos">Catch Zapdos</label>
              </div>
              <div class="checkbox-item">
                <input id="redblue-checkbox-moltres" type="checkbox" />
                <img alt="Icon of Moltres" class="pokeicon small" src="../images/icons/pokemon/gen1/redblue/moltres-color.png" />
                <label class="text-sm lg:tooltip" data-tip="Moltres appears in the middle of the Victory Road." for="redblue-checkbox-moltres">Catch Moltres</label>
              </div>
              <div class="checkbox-item">
                <input id="redblue-checkbox-articuno" type="checkbox" />
                <img alt="Icon of Articuno" class="pokeicon small" src="../images/icons/pokemon/gen1/redblue/articuno-color.png" />
                <label class="text-sm lg:tooltip" data-tip="Articuno appears at the bottom of Seafoam Islands." for="redblue-checkbox-articuno">Catch Articuno</label>
              </div>
            </div>
            <div class="legendaries-rightrow">
              <div class="checkbox-item">
                <input id="redblue-checkbox-mewtwo" type="checkbox" />
                <img alt="Icon of Mewtwo" class="pokeicon small" src="../images/icons/pokemon/gen1/redblue/mewtwo-color.png" />
                <label class="text-sm lg:tooltip" data-tip="Mewtwo appears in Cerulean Cave." for="redblue-checkbox-mewtwo">Catch Mewtwo</label>
              </div>
              <div class="checkbox-item">
                <input id="redblue-checkbox-mew" type="checkbox" />
                <img alt="Icon of Mew" class="pokeicon small" src="../images/icons/pokemon/gen1/redblue/mew-color.png" />
                <label class="text-sm lg:tooltip" data-tip="Under the truck." for="redblue-checkbox-mew">Catch Mew</label>
              </div>
            </div>
          </div>
        </div>
        <div class="giftpokemon">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Obtain all In-Game Gift Pokémon</label></span>
          </div>
          <div class="giftpokemon-rowcontainer">
            <div class="giftpokemon-leftrow">
              <div class="checkbox-item">
                <input id="redblue-checkbox-hitmonlee" type="checkbox" />
                <img alt="Icon of Hitmonlee" class="pokeicon small" src="../images/icons/pokemon/gen1/redblue/hitmonlee-color.png" />
                <label class="text-sm lg:tooltip" data-tip="Received at the Fighting Dojo gym in Saffron City upon defeating the Karate King." for="redblue-checkbox-hitmonlee">Obtain Hitmonlee</label>
              </div>
              <div class="checkbox-item">
                <input id="redblue-checkbox-hitmonchan" type="checkbox" />
                <img alt="Icon of Hitmonchan" class="pokeicon small" src="../images/icons/pokemon/gen1/redblue/hitmonchan-color.png" />
                <label class="text-sm lg:tooltip" data-tip="Received at the Fighting Dojo gym in Saffron City upon defeating the Karate King." for="redblue-checkbox-hitmonchan">Obtain Hitmonchan</label>
              </div>
              <div class="checkbox-item">
                <input id="redblue-checkbox-lapras" type="checkbox" />
                <img alt="Icon of Lapras" class="pokeicon small" src="../images/icons/pokemon/gen1/redblue/lapras-color.png" />
                <label class="text-sm lg:tooltip" data-tip="Given at Saffron City in the Siph Co. room with your rival." for="redblue-checkbox-lapras">Obtain Lapras</label>
              </div>
              <div class="checkbox-item">
                <input id="redblue-checkbox-eevee" type="checkbox" />
                <img alt="Icon of Eevee" class="pokeicon small" src="../images/icons/pokemon/gen1/redblue/eevee-color.png" />
                <label class="text-sm lg:tooltip" data-tip="At the roof of the Celadon Mansion." for="redblue-checkbox-eevee">Obtain Eevee</label>
              </div>
            </div>
            <div class="giftpokemon-rightrow">
              <div class="checkbox-item">
                <input id="redblue-checkbox-omanyte" type="checkbox" />
                <img alt="Icon of Omanyte" class="pokeicon small" src="../images/icons/pokemon/gen1/redblue/omanyte-color.png" />
                <label class="text-sm lg:tooltip" data-tip="At the end of Mt. Moon." for="redblue-checkbox-omanyte">Obtain Omanyte</label>
              </div>
              <div class="checkbox-item">
                <input id="redblue-checkbox-kabuto" type="checkbox" />
                <img alt="Icon of Kabuto" class="pokeicon small" src="../images/icons/pokemon/gen1/redblue/kabuto-color.png" />
                <label class="text-sm lg:tooltip" data-tip="At the end of Mt. Moon." for="redblue-checkbox-kabuto">Obtain Kabuto</label>
              </div>
              <div class="checkbox-item">
                <input id="redblue-checkbox-aerodactyl" type="checkbox" />
                <img alt="Icon of Aerodactyl" class="pokeicon small" src="../images/icons/pokemon/gen1/redblue/aerodactyl-color.png" />
                <label class="text-sm lg:tooltip" data-tip="You need the Old Amber, which is found in the Pewter City museum." for="redblue-checkbox-aerodactyl">Obtain Aerodactyl</label>
              </div>
            </div>
          </div>
        </div>
        <div class="ingametrades">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Complete all In-Game Trades</label></span>
          </div>
          <div class="ingametrades-rowcontainer">
            <div class="ingametrades-leftrow">
              <div class="checkbox-item">
                <input id="redblue-checkbox-abra-mr-mime" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Route 2. Outside Diglett's Cave." for="redblue-checkbox-abra-mr-mime">Trade Abra for Mr. Mime</label>
              </div>
              <div class="checkbox-item">
                <input id="redblue-checkbox-nidoran-m-f" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Route 5. Underground tunnel, north exit." for="redblue-checkbox-nidoran-m-f">Trade Nidoran M for Nidoran F</label>
              </div>
              <div class="checkbox-item">
                <input id="redblue-checkbox-nidorino-nidorina" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Route 11. Inside the gatehouse." for="redblue-checkbox-nidorino-nidorina">Trade Nidorino for Nidorina</label>
              </div>
              <div class="checkbox-item">
                <input id="redblue-checkbox-slowbro-lickitung" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Route 18. Inside the gatehouse." for="redblue-checkbox-slowbro-lickitung">Trade Slowbro for Lickitung</label>
              </div>
              <div class="checkbox-item">
                <input id="redblue-checkbox-poliwhirl-jynx" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Cerulean City. The house next to the Pokémon Center." for="redblue-checkbox-poliwhirl-jynx">Trade Poliwhirl for Jynx</label>
              </div>
            </div>
            <div class="ingametrades-rightrow">
              <div class="checkbox-item">
                <input id="redblue-checkbox-spearow-farfetchd" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Vermillion City." for="redblue-checkbox-spearow-farfetchd">Trade Spearow for Farfetch'd</label>
              </div>
              <div class="checkbox-item">
                <input id="redblue-checkbox-ponyta-seel" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Cinnabar Island. Inside the Cinnabar laboratory." for="redblue-checkbox-ponyta-seel">Trade Ponyta for Seel</label>
              </div>
              <div class="checkbox-item">
                <input id="redblue-checkbox-raichu-electrode" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Cinnabar Island. Inside the Cinnabar laboratory." for="redblue-checkbox-raichu-electrode">Trade Raichu for Electrode</label>
              </div>
              <div class="checkbox-item">
                <input id="redblue-checkbox-venonat-tangela" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Cinnabar Island. Inside the Cinnabar laboratory." for="redblue-checkbox-venonat-tangela">Trade Venonat for Tangela</label>
              </div>
            </div>
          </div>
        </div>
        <div class="items">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Items</label></span>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-alltms" type="checkbox" />
            <img alt="Icon of TM" class="pokeicon item" src="../images/icons/inventory/tms/normal.png" />
            <label class="text-sm lg:tooltip" data-tip="Find all TM's." for="redblue-checkbox-alltms">Collect all TM's</label>
          </div>
        </div>
        <div class="items">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Complete the Gym Challenge</label></span>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-badge-boulder" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Brock, Pewter City Gym." for="redblue-checkbox-badge-boulder">Boulder Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-badge-cascade" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Misty, Cerulean City Gym." for="redblue-checkbox-badge-cascade">Cascade Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-badge-thunder" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Lt. Surge, Vermilion City Gym. You need Cut first to reach the gym." for="redblue-checkbox-badge-thunder">Thunder Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-badge-rainbow" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Erika, Celadon City Gym." for="redblue-checkbox-badge-rainbow">Rainbow Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-badge-soul" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Koga, Fuchsia City Gym." for="redblue-checkbox-badge-soul">Soul Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-badge-marsh" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Sabrina, Saffron City Gym." for="redblue-checkbox-badge-marsh">Marsh Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-badge-volcano" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Blaine, Cinnabar Island Gym. You need the Secret Key from the Pokémon Mansion." for="redblue-checkbox-badge-volcano">Volcano Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-badge-earth" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Giovanni, Viridian City Gym. It opens after you have the first seven badges." for="redblue-checkbox-badge-earth">Earth Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-elite-four" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Lorelei, Bruno, Agatha and Lance at the Indigo Plateau." for="redblue-checkbox-elite-four">Defeat the Elite Four</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-champion" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Beat your rival at the end of the Elite Four and watch the Hall of Fame." for="redblue-checkbox-champion">Become Champion</label>
          </div>
        </div>
        <div class="items">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Other Pokémon Encounters</label></span>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-porygon" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Prize at the Celadon City Game Corner (6500 coins in Blue, 9999 in Red). You need the Coin Case." for="redblue-checkbox-porygon">Obtain Porygon</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-snorlax" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Wake it with the Poké Flute. There is one on Route 12 and one on Route 16." for="redblue-checkbox-snorlax">Catch Snorlax</label>
          </div>
        </div>
        <div class="items">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Key Items and HMs</label></span>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-hm-cut" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="S.S. Anne, from the captain." for="redblue-checkbox-hm-cut">HM01 Cut</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-hm-fly" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Route 16, in the house west of Celadon City." for="redblue-checkbox-hm-fly">HM02 Fly</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-hm-surf" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Safari Zone, from the owner of the Secret House." for="redblue-checkbox-hm-surf">HM03 Surf</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-hm-strength" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Safari Zone, from the Warden. Bring him the Gold Teeth." for="redblue-checkbox-hm-strength">HM04 Strength</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-hm-flash" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Route 2 gate, from Oak's Aide once you own 10 Pokémon." for="redblue-checkbox-hm-flash">HM05 Flash</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-bicycle" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Give the Bike Voucher from the Pokémon Fan Club to the Cerulean City Bike Shop." for="redblue-checkbox-bicycle">Bicycle</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-silph-scope" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Rocket Hideout, Celadon City, after defeating Giovanni." for="redblue-checkbox-silph-scope">Silph Scope</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-poke-flute" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Pokémon Tower, Lavender Town, from Mr. Fuji." for="redblue-checkbox-poke-flute">Poké Flute</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-secret-key" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Pokémon Mansion, Cinnabar Island." for="redblue-checkbox-secret-key">Secret Key</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-card-key" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Silph Co., Saffron City." for="redblue-checkbox-card-key">Card Key</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-rod-old" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Vermilion City, from the Fishing Guru in the house near the Pokémon Center." for="redblue-checkbox-rod-old">Old Rod</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-rod-good" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Fuchsia City, from the Fishing Guru's brother." for="redblue-checkbox-rod-good">Good Rod</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-rod-super" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Route 12, from the Fishing Guru's brother in the house." for="redblue-checkbox-rod-super">Super Rod</label>
          </div>

          <div class="checkbox-item">
            <input id="redblue-checkbox-oaks-aides" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Oak's Aides give Itemfinder at 30 Pokémon (Route 11 gate) and Exp. All at 50 Pokémon (Route 15 gate)." for="redblue-checkbox-oaks-aides">Exp. All and Itemfinder</label>
          </div>
          <div class="checkbox-item">
            <input id="redblue-checkbox-master-ball" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Silph Co., Saffron City, from the President after defeating Giovanni there." for="redblue-checkbox-master-ball">Master Ball</label>
          </div>
        </div>
      </div>
    </div>

    <footer class="text-sm">
      <ul>
        <li>
          <a href="../index.html">Progression Dex</a>
        </li>
        <li>
          <a href="#">Twitter</a>

  </body>
</html>
