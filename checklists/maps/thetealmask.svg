<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-label="Schematic map of Kitakami">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe9ea"/><stop offset="1" stop-color="#9fd5d8"/></linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe8b8"/><stop offset="1" stop-color="#a9d08e"/></linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#sea)"/>
  <!-- landmass -->
  <path d="M70 70 Q110 28 190 40 Q260 18 330 44 Q408 52 428 120 Q448 188 414 246 Q392 308 316 322 Q244 344 170 326 Q90 318 58 252 Q30 186 52 128 Z" fill="url(#land)" stroke="#6f9a58" stroke-width="3"/>
  <!-- central lake -->
  <ellipse cx="236" cy="178" rx="34" ry="22" fill="#9fd5d8" stroke="#6aa9ad" stroke-width="2"/>
  <!-- mountains in the east -->
  <g fill="#b7a98c" stroke="#8a7d63" stroke-width="2" stroke-linejoin="round">
    <path d="M346 150 l22 -40 l22 40 z"/><path d="M372 176 l24 -44 l24 44 z"/><path d="M340 196 l20 -34 l20 34 z"/>
  </g>
  <!-- SW lake (Wistful Fields) -->
  <ellipse cx="124" cy="266" rx="26" ry="16" fill="#9fd5d8" stroke="#6aa9ad" stroke-width="2"/>
  <!-- place markers -->
  <g fill="#fff" stroke="#3a5a2c" stroke-width="2">
    <rect x="228" y="270" width="12" height="12" rx="2"/>
    <rect x="262" y="236" width="12" height="12" rx="2"/>
  </g>
  <!-- labels -->
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2d4a22" paint-order="stroke" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round">
    <text x="150" y="108">Paradise Barrens</text>
    <text x="62" y="300">Wistful Fields</text>
    <text x="344" y="102">Oni Mountain</text>
    <text x="196" y="298">Mossui Town</text>
    <text x="250" y="226">Kitakami Hall</text>
  </g>
  <!-- compass -->
  <g transform="translate(446 44)" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#2d4a22" text-anchor="middle">
    <path d="M0 -4 L6 12 L0 8 L-6 12 Z" fill="#2d4a22"/><text y="-10">N</text>
  </g>
</svg>
