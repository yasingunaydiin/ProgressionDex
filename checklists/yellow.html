<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link href="css/yellow.css" rel="stylesheet" />

    <meta name="description" content="A tool for tracking your progression in Pokemon games. Easily choose between games and track your game progress." />
    <meta name="keywords" content="pokemon, checklist, pokedex, progress, completion, speedrun, checklist, check list, locations, characters, games, game" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js" defer></script>

  <body>
    <div class="navbar bg-white rounded-3xl shadow-lg mt-2 fixed top-0 flex items-center justify-between" style="width: 95%; z-index: 1000; left: 50%; transform: translateX(-50%)">
      <div class="flex items-center gap-4">
        <a class="btn btn-ghost text-2xl" href="../index.html"><span class="title" style="color: #fad61d">Progression Dex |</span></a>
        <div class="flex items-center gap-2">
          <img alt="Logo of Pokemon Yellow" class="w-20" src="../images/logos/yellow-logo.webp" />
        </div>
      </div>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="page-container" data-game="yellow">
      <div class="wide-panel pokedex">
        <label class="panel-label">Pokédex</label>
        <div class="completepokedex">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Complete the Kanto Pokédex</label></span>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-bulbasaur" type="checkbox" />
            <img alt="Icon of Bulbasaur" class="pokeicon small" src="../images/icons/pokemon/gen1/yellow/bulbasaur.png" />
            <label class="text-sm lg:tooltip" data-tip="A girl in Cerulean City is willing to give you her Bulbasaur if your Pikachu is in good spirits." for="yellow-checkbox-bulbasaur">Bulbasaur</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-charmender" type="checkbox" />
            <img alt="Icon of Charmender" class="pokeicon small" src="../images/icons/pokemon/gen1/yellow/charmender.png" />
            <label class="text-sm lg:tooltip" data-tip="Route 24, a trainer on a plateau is ready to offer you his Charmander." for="yellow-checkbox-charmender">Charmender</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-squirtle" type="checkbox" />
            <img alt="Icon of Squirtle" class="pokeicon small" src="../images/icons/pokemon/gen1/yellow/squirtle.png" />
            <label class="text-sm lg:tooltip" data-tip="In Vermillion City, Officer Jenny will present you with a Squirtle once you have obtained the Thunderbadge." for="yellow-checkbox-squirtle">Squirtle</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-trade-evolutions" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Trade Kadabra, Machoke, Graveler and Haunter to a friend (or a second copy of the game) so they evolve into Alakazam, Machamp, Golem and Gengar." for="yellow-checkbox-trade-evolutions"
              >Evolve all trade evolutions</label
            >
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-diploma" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="After catching all Pokemon, go to the Game Freak Headquarters in Celadon Condominiums and speak with the lead developer." for="yellow-checkbox-diploma">Get Diploma</label>
          </div>
        </div>
        <div class="legendaries">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Catch all Legendaries</label></span>
          </div>
          <div class="legendaries-rowcontainer">
            <div class="legendaries-leftrow">
              <div class="checkbox-item">
                <input id="yellow-checkbox-zapdos" type="checkbox" />
                <img alt="Icon of Zapdos" class="pokeicon small" src="../images/icons/pokemon/gen1/yellow/zapdos.png" />
                <label class="text-sm lg:tooltip" data-tip="Zapdos appears at the end of the Power Plant in the room with the exit." for="yellow-checkbox-zapdos">Zapdos</label>
              </div>
              <div class="checkbox-item">
                <input id="yellow-checkbox-moltres" type="checkbox" />
                <img alt="Icon of Moltres" class="pokeicon small" src="../images/icons/pokemon/gen1/yellow/moltres.png" />
                <label class="text-sm lg:tooltip" data-tip="Moltres appears in the middle of the Victory Road." for="yellow-checkbox-moltres">Moltres</label>
              </div>
              <div class="checkbox-item">
                <input id="yellow-checkbox-articuno" type="checkbox" />
                <img alt="Icon of Articuno" class="pokeicon small" src="../images/icons/pokemon/gen1/yellow/articuno.png" />
                <label class="text-sm lg:tooltip" data-tip="Articuno appears at the bottom of Seafoam Islands." for="yellow-checkbox-articuno">Articuno</label>
              </div>
            </div>
            <div class="legendaries-rightrow">
              <div class="checkbox-item">
                <input id="yellow-checkbox-mewtwo" type="checkbox" />
                <img alt="Icon of Mewtwo" class="pokeicon small" src="../images/icons/pokemon/gen1/yellow/mewtwo.png" />
                <label class="text-sm lg:tooltip" data-tip="Mewtwo appears in Cerulean Cave." for="yellow-checkbox-mewtwo">Mewtwo</label>
              </div>
              <div class="checkbox-item">
                <input id="yellow-checkbox-mew" type="checkbox" />
                <img alt="Icon of Mew" class="pokeicon small" src="../images/icons/pokemon/gen1/yellow/mew.png" />
                <label class="text-sm lg:tooltip" data-tip="A quick Google research shows that Mew is only catchable through glitches." for="yellow-checkbox-mew">Mew</label>
              </div>
            </div>
          </div>
        </div>
        <div class="giftpokemon">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Obtain all In-Game Gift Pokémon</label></span>
          </div>
          <div class="giftpokemon-rowcontainer">
            <div class="giftpokemon-leftrow">
              <div class="checkbox-item">
                <input id="yellow-checkbox-hitmonlee" type="checkbox" />
                <img alt="Icon of Hitmonlee" class="pokeicon small" src="../images/icons/pokemon/gen1/yellow/hitmonlee.png" />
                <label class="text-sm lg:tooltip" data-tip="Received at the Fighting Dojo gym in Saffron City upon defeating the Karate King." for="yellow-checkbox-hitmonlee">Hitmonlee</label>
              </div>
              <div class="checkbox-item">
                <input id="yellow-checkbox-hitmonchan" type="checkbox" />
                <img alt="Icon of Hitmonchan" class="pokeicon small" src="../images/icons/pokemon/gen1/yellow/hitmonchan.png" />
                <label class="text-sm lg:tooltip" data-tip="Received at the Fighting Dojo gym in Saffron City upon defeating the Karate King." for="yellow-checkbox-hitmonchan">Hitmonchan</label>
              </div>
              <div class="checkbox-item">
                <input id="yellow-checkbox-lapras" type="checkbox" />
                <img alt="Icon of Lapras" class="pokeicon small" src="../images/icons/pokemon/gen1/yellow/lapras.png" />
                <label class="text-sm lg:tooltip" data-tip="Given at Saffron City in the Siph Co. room with your rival." for="yellow-checkbox-lapras">Lapras</label>
              </div>
              <div class="checkbox-item">
                <input id="yellow-checkbox-eevee" type="checkbox" />
                <img alt="Icon of Eevee" class="pokeicon small" src="../images/icons/pokemon/gen1/yellow/eevee.png" />
                <label class="text-sm lg:tooltip" data-tip="At the roof of the Celadon Mansion." for="yellow-checkbox-eevee">Eevee</label>
              </div>
            </div>
            <div class="giftpokemon-rightrow">
              <div class="checkbox-item">
                <input id="yellow-checkbox-omanyte" type="checkbox" />
                <img alt="Icon of Omanyte" class="pokeicon small" src="../images/icons/pokemon/gen1/yellow/omanyte.png" />
                <label class="text-sm lg:tooltip" data-tip="At the end of Mt. Moon." for="yellow-checkbox-omanyte">Omanyte</label>
              </div>
              <div class="checkbox-item">
                <input id="yellow-checkbox-kabuto" type="checkbox" />
                <img alt="Icon of Kabuto" class="pokeicon small" src="../images/icons/pokemon/gen1/yellow/kabuto.png" />
                <label class="text-sm lg:tooltip" data-tip="At the end of Mt. Moon." for="yellow-checkbox-kabuto">Kabuto</label>
              </div>
              <div class="checkbox-item">
                <input id="yellow-checkbox-aerodactyl" type="checkbox" />
                <img alt="Icon of Aerodactyl" class="pokeicon small" src="../images/icons/pokemon/gen1/yellow/aerodactyl.png" style="margin-right: 5px" />
                <label class="text-sm lg:tooltip" data-tip="You need the Old Amber, which is found in the Pewter City museum." for="yellow-checkbox-aerodactyl">Aerodactyl</label>
              </div>
            </div>
          </div>
        </div>
        <div class="ingametrades">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Complete all In-Game Trades</label></span>
          </div>
          <div class="ingametrades-rowcontainer">
            <div class="ingametrades-leftrow">
              <div class="checkbox-item">
                <input id="yellow-checkbox-clefairy-mrmime" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Route 2. Outside Diglett's Cave." for="yellow-checkbox-clefairy-mrmime">Clefairy for Mr. Mime</label>
              </div>
              <div class="checkbox-item">
                <input id="yellow-checkbox-cubone-machoke" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Route 5. Underground tunnel, north exit." for="yellow-checkbox-cubone-machoke">Cubone for Machoke</label>
              </div>
              <div class="checkbox-item">
                <input id="yellow-checkbox-lickitung-dugtrio" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Route 11. Inside the gatehouse." for="yellow-checkbox-lickitung-dugtrio">Lickitung for Dugtrio</label>
              </div>
              <div class="checkbox-item">
                <input id="yellow-checkbox-tangela-parasect" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Route 18. Inside the gatehouse." for="yellow-checkbox-tangela-parasect">Tangela for Parasect</label>
              </div>
            </div>
            <div class="ingametrades-rightrow">
              <div class="checkbox-item">
                <input id="yellow-checkbox-golduck-rhydon" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Cinnabar Island. By the Pokemon Center." for="yellow-checkbox-golduck-rhydon">Golduck for Rhydon</label>
              </div>
              <div class="checkbox-item">
                <input id="yellow-checkbox-growlithe-dewgong" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Cinnabar Island. By the Pokemon Center." for="yellow-checkbox-growlithe-dewgong">Growlithe for Dewgong</label>
              </div>
              <div class="checkbox-item">
                <input id="yellow-checkbox-kangaskhan-muk" type="checkbox" />
                <label class="text-sm lg:tooltip" data-tip="Cinnabar Island. Inside the laboratory." for="yellow-checkbox-kangaskhan-muk">Kangaskhan for Muk</label>
              </div>
            </div>
          </div>
        </div>
        <div class="items">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Items</label></span>
          </div>

          <div class="checkbox-item">
            <input id="yellow-checkbox-alltms" type="checkbox" />
            <img alt="Icon of a TM" class="pokeicon item" src="../images/icons/inventory/tms/normal.png" />
            <label class="text-sm lg:tooltip" data-tip="Find all TM's." for="yellow-checkbox-alltms">Collect all TM's</label>
          </div>
        </div>
        <div class="items">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Complete the Gym Challenge</label></span>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-badge-boulder" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Brock, Pewter City Gym." for="yellow-checkbox-badge-boulder">Boulder Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-badge-cascade" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Misty, Cerulean City Gym." for="yellow-checkbox-badge-cascade">Cascade Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-badge-thunder" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Lt. Surge, Vermilion City Gym. You need Cut first to reach the gym." for="yellow-checkbox-badge-thunder">Thunder Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-badge-rainbow" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Erika, Celadon City Gym." for="yellow-checkbox-badge-rainbow">Rainbow Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-badge-soul" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Koga, Fuchsia City Gym." for="yellow-checkbox-badge-soul">Soul Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-badge-marsh" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Sabrina, Saffron City Gym." for="yellow-checkbox-badge-marsh">Marsh Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-badge-volcano" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Blaine, Cinnabar Island Gym. You need the Secret Key from the Pokémon Mansion." for="yellow-checkbox-badge-volcano">Volcano Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-badge-earth" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Giovanni, Viridian City Gym. It opens after you have the first seven badges." for="yellow-checkbox-badge-earth">Earth Badge</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-elite-four" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Lorelei, Bruno, Agatha and Lance at the Indigo Plateau." for="yellow-checkbox-elite-four">Defeat the Elite Four</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-champion" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Beat your rival at the end of the Elite Four and watch the Hall of Fame." for="yellow-checkbox-champion">Become Champion</label>
          </div>
        </div>
        <div class="items">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Other Pokémon Encounters</label></span>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-porygon" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Prize at the Celadon City Game Corner. You need the Coin Case." for="yellow-checkbox-porygon">Obtain Porygon</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-snorlax" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Wake it with the Poké Flute. There is one on Route 12 and one on Route 16." for="yellow-checkbox-snorlax">Catch Snorlax</label>
          </div>
        </div>
        <div class="items">
          <div class="checkbox-item">
            <span class="title"><label class="text-lg">Key Items and HMs</label></span>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-hm-cut" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="S.S. Anne, from the captain." for="yellow-checkbox-hm-cut">HM01 Cut</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-hm-fly" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Route 16, in the house west of Celadon City." for="yellow-checkbox-hm-fly">HM02 Fly</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-hm-surf" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Safari Zone, from the owner of the Secret House." for="yellow-checkbox-hm-surf">HM03 Surf</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-hm-strength" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Safari Zone, from the Warden. Bring him the Gold Teeth." for="yellow-checkbox-hm-strength">HM04 Strength</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-hm-flash" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Route 2 gate, from Oak's Aide once you own 10 Pokémon." for="yellow-checkbox-hm-flash">HM05 Flash</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-bicycle" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Give the Bike Voucher from the Pokémon Fan Club to the Cerulean City Bike Shop." for="yellow-checkbox-bicycle">Bicycle</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-silph-scope" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Rocket Hideout, Celadon City, after defeating Giovanni." for="yellow-checkbox-silph-scope">Silph Scope</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-poke-flute" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Pokémon Tower, Lavender Town, from Mr. Fuji." for="yellow-checkbox-poke-flute">Poké Flute</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-secret-key" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Pokémon Mansion, Cinnabar Island." for="yellow-checkbox-secret-key">Secret Key</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-card-key" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Silph Co., Saffron City." for="yellow-checkbox-card-key">Card Key</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-rod-old" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Vermilion City, from the Fishing Guru in the house near the Pokémon Center." for="yellow-checkbox-rod-old">Old Rod</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-rod-good" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Fuchsia City, from the Fishing Guru's brother." for="yellow-checkbox-rod-good">Good Rod</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-rod-super" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Route 12, from the Fishing Guru's brother in the house." for="yellow-checkbox-rod-super">Super Rod</label>
          </div>

          <div class="checkbox-item">
            <input id="yellow-checkbox-oaks-aides" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Oak's Aides give Itemfinder at 30 Pokémon (Route 11 gate) and Exp. All at 50 Pokémon (Route 15 gate)." for="yellow-checkbox-oaks-aides">Exp. All and Itemfinder</label>
          </div>
          <div class="checkbox-item">
            <input id="yellow-checkbox-master-ball" type="checkbox" />
            <label class="text-sm lg:tooltip" data-tip="Silph Co., Saffron City, from the President after defeating Giovanni there." for="yellow-checkbox-master-ball">Master Ball</label>
          </div>
        </div>
      </div>
    </div>
