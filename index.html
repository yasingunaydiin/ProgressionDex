    <script>
      document.querySelector(".top nav").append(pdexTheme.button("dark"));
      const row = document.getElementById("row");
      const tiles = [...row.querySelectorAll(".tile")];
      const bgs = [document.getElementById("bgA"), document.getElementById("bgB")];
      let current = -1;
      let layer = 0;

      function progress(game) {
        try {
          const s = JSON.parse(localStorage.getItem(`pdex-summary-${game}`));
          if (s && s.total) return s;
        } catch {}
        return null;
      }

      function select(index, scroll = true) {
        index = Math.max(0, Math.min(tiles.length - 1, index));
        if (index === current) return;
        current = index;
        const t = tiles[index];
        tiles.forEach((x) => x.classList.toggle("selected", x === t));
        if (scroll) t.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });

        const c1 = getComputedStyle(t).getPropertyValue("--c1").trim();
        layer = 1 - layer;
        bgs[layer].style.setProperty("--glow", c1);
        bgs[layer].style.backgroundImage = `url(images/patterns/pattern-${t.dataset.pattern}.png)`;
        bgs[layer].classList.add("on");
        bgs[1 - layer].classList.remove("on");

        document.getElementById("dGen").textContent = t.dataset.gen;
        document.getElementById("dName").textContent = t.dataset.name;
        document.getElementById("dOpen").href = t.href;
        const p = progress(t.dataset.game);
        const pct = p ? Math.round((p.done / p.total) * 100) : 0;
        document.getElementById("dBar").style.width = pct + "%";
        document.getElementById("dText").textContent = !p || !p.done ? "Not started" : p.done >= p.total ? "Completed" : `${p.done} / ${p.total} · ${pct}%`;
        try {
          localStorage.setItem("pdex-last-game", t.dataset.game);
        } catch {}
      }

      tiles.forEach((t, i) => {
        t.addEventListener("click", (e) => {
          if (i !== current) {
            e.preventDefault();
            select(i);
          }
        });
        t.addEventListener("mouseenter", () => matchMedia("(hover: hover)").matches && select(i));
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") select(current + 1);
        else if (e.key === "ArrowLeft") select(current - 1);
        else if (e.key === "Home") select(0);
        else if (e.key === "End") select(tiles.length - 1);
        else if (e.key === "Enter" && !e.target.closest("a")) location.href = tiles[current].href;
        else if (e.key.toLowerCase() === "l" && !e.metaKey && !e.ctrlKey) location.href = "list/index.html";
        else return;
        if (e.key.startsWith("Arrow") || e.key === "Home" || e.key === "End") e.preventDefault();
      });

      // a plain mouse wheel scrolls the row sideways
      row.addEventListener(
        "wheel",
        (e) => {
          if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
            row.scrollLeft += e.deltaY;
            e.preventDefault();
          }
        },
        { passive: false },
      );

      let start = 0;
      try {
        start = Math.max(
          0,
          tiles.findIndex((t) => t.dataset.game === localStorage.getItem("pdex-last-game")),
        );
      } catch {}
      select(start, false);
      tiles[start].scrollIntoView({ inline: "center", block: "nearest" });
    </script>
